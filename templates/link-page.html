<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Re:mind | Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f2f1ee;
    --surface: #ffffff;
    --surface-2: #e7e6e2;
    --ink: #16161a;
    --ink-soft: #5b5b61;
    --ink-faint: #9a9a94;
    --accent: #e8432e;
    --accent-ink: #fffaf7;
    --border: rgba(22, 22, 26, 0.1);
    --shadow: rgba(22, 22, 26, 0.06);

    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas,
      "Liberation Mono", monospace;
    --font-serif: "Hiragino Mincho ProN", "YuMincho", "Iowan Old Style",
      Georgia, "Noto Serif JP", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131315;
      --surface: #1c1c1f;
      --surface-2: #26262a;
      --ink: #f1f0ec;
      --ink-soft: #a8a7a2;
      --ink-faint: #6c6c6c;
      --accent: #ff6a4d;
      --accent-ink: #17110f;
      --border: rgba(241, 240, 236, 0.1);
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #131315;
    --surface: #1c1c1f;
    --surface-2: #26262a;
    --ink: #f1f0ec;
    --ink-soft: #a8a7a2;
    --ink-faint: #6c6c6c;
    --accent: #ff6a4d;
    --accent-ink: #17110f;
    --border: rgba(241, 240, 236, 0.1);
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 9vh 20px 10vh;
    font-family: var(--font-serif);
  }

  .page {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    flex-shrink: 0;
    animation: blink 1.6s steps(1) infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow::before {
      animation: none;
    }
  }

  @keyframes blink {
    0%,
    45% {
      opacity: 1;
    }
    50%,
    95% {
      opacity: 0.25;
    }
    100% {
      opacity: 1;
    }
  }

  .hero {
    width: 100%;
    aspect-ratio: 3 / 1;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px var(--shadow);
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .identity {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    margin-top: -46px;
  }

  .brand-badge {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    z-index: 2;
  }

  .brand-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .tagline {
    font-family: var(--font-serif);
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0;
  }

  .divider {
    height: 1px;
    background: var(--border);
    border: none;
    margin: 0;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 12px;
  }

  .schedule {
    display: flex;
    flex-direction: column;
  }

  .schedule-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .schedule-year {
    padding: 0 0 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .schedule-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
  }

  .schedule-row + .schedule-row {
    border-top: 1px solid var(--border);
  }

  .schedule-date {
    flex-shrink: 0;
    width: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding-top: 1px;
  }

  .schedule-date .month {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .schedule-date .day {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 28px;
    line-height: 1.05;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .schedule-date .dow {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
  }

  .schedule-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .schedule-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .schedule-name {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
  }

  .schedule-tag {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--accent);
  }

  .schedule-line {
    font-family: var(--font-serif);
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .schedule-line.mono {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .schedule-thumb {
    flex-shrink: 0;
    align-self: flex-start;
    width: 120px;
    height: 180px;
    padding: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px var(--shadow);
    background: none;
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }

  .schedule-thumb:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .schedule-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: rgba(10, 10, 10, 0.86);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease;
    cursor: zoom-out;
  }

  .lightbox.open {
    opacity: 1;
    visibility: visible;
  }

  @media (prefers-reduced-motion: reduce) {
    .lightbox {
      transition: none;
    }
  }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    cursor: default;
  }

  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }

  .lightbox-close:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .schedule-empty {
    padding: 14px 0;
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--ink-soft);
    text-align: center;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease,
      background 0.15s ease;
  }

  .link-row:hover {
    transform: translateX(3px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    background: var(--surface-2);
  }

  .link-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-row {
      transition: none;
    }
    .link-row:hover {
      transform: none;
    }
  }

  .icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .icon svg {
    width: 19px;
    height: 19px;
  }

  .icon .brand-text {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .link-label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .link-desc {
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--ink-soft);
  }

  .chevron {
    flex-shrink: 0;
    color: var(--ink-faint);
  }

  .chevron svg {
    width: 16px;
    height: 16px;
    transition: transform 0.15s ease;
  }

  .link-row:hover .chevron svg {
    transform: translateX(2px);
    color: var(--accent);
  }

  footer {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    text-align: center;
    padding-top: 4px;
  }
</style>
</head>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button type="button" class="lightbox-close" onclick="closeLightbox()" aria-label="閉じる">&times;</button>
  <img id="lightbox-img" src="" alt="フライヤー拡大表示" onclick="event.stopPropagation()" />
</div>

<script>
  var LIVES = __LIVES_JSON__;

  var DOW = ["日", "月", "火", "水", "木", "金", "土"];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderSchedule() {
    var list = document.getElementById("schedule-list");
    if (!LIVES.length) {
      list.innerHTML = '<li class="schedule-empty">現在、決まっている予定はありません。</li>';
      return;
    }
    var html = "";
    var lastYear = null;
    LIVES.forEach(function (live) {
      var d = new Date(live.date + "T00:00:00");
      var year = d.getFullYear();
      if (year !== lastYear) {
        html += '<li class="schedule-year">' + year + "</li>";
        lastYear = year;
      }

      var lines = [];
      if (live.venue) lines.push(escapeHtml(live.venue));
      if (live.taiban) lines.push("w/ " + escapeHtml(live.taiban.replace(/\n/g, " / ")));
      if (live.stage_time) lines.push('<span class="schedule-line mono">出演時間 ' + escapeHtml(live.stage_time) + "</span>");
      if (live.description) lines.push(escapeHtml(live.description));
      var linesHtml = lines
        .map(function (l) {
          return l.indexOf('<span class="schedule-line mono">') === 0 ? l : '<span class="schedule-line">' + l + "</span>";
        })
        .join("");

      var isHost = live.type === "主催";
      var tagHtml = isHost ? '<span class="schedule-tag">主催</span>' : "";
      var thumbHtml = live.flyer_url
        ? '<button type="button" class="schedule-thumb" onclick="openLightbox(this)" aria-label="フライヤーを拡大表示">' +
          '<img src="' + live.flyer_url + '" data-full="' + (live.flyer_url_large || live.flyer_url) + '" alt="" loading="lazy" />' +
          "</button>"
        : "";

      html +=
        '<li class="schedule-row">' +
        '<span class="schedule-date">' +
        '<span class="month">' + (d.getMonth() + 1) + "月</span>" +
        '<span class="day">' + d.getDate() + "</span>" +
        '<span class="dow">(' + DOW[d.getDay()] + ")</span>" +
        "</span>" +
        '<span class="schedule-body">' +
        '<span class="schedule-top">' +
        '<span class="schedule-name">' + escapeHtml(live.name) + "</span>" +
        tagHtml +
        "</span>" +
        linesHtml +
        "</span>" +
        thumbHtml +
        "</li>";
    });
    list.innerHTML = html;
  }

  renderSchedule();

  function openLightbox(btn) {
    var full = btn.querySelector("img").dataset.full;
    var overlay = document.getElementById("lightbox");
    document.getElementById("lightbox-img").src = full;
    overlay.classList.add("open");
    document.addEventListener("keydown", onLightboxKeydown);
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    document.removeEventListener("keydown", onLightboxKeydown);
  }

  function onLightboxKeydown(e) {
    if (e.key === "Escape") closeLightbox();
  }
</script>
