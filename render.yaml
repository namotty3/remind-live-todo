services:
  - type: web
    name: band-live-todo
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CALENDAR_PASSWORD
        sync: false
      - key: CALENDAR_CHAT_ID
        sync: false
